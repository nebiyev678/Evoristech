name: Validate

# Two independent gates, neither of which needs a database, a wallet or a secret.
#
#   apexlang     — parses the APEXLang source offline with SQLcl
#   sql-safety   — static checks for SQL patterns that can destroy data
#
# Both run on every pull request and every push to main.

on:
  pull_request:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  apexlang:
    name: APEXLang source validation
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      # Cheap guard: a credential file must never reach this repo.
      - name: Refuse committed credentials
        run: |
          if git ls-files \
             | grep -Ei '(cwallet\.sso|ewallet\.p12|\.p12$|\.jks$|\.key$|tnsnames\.ora|sqlnet\.ora|(^|/)\.env$)'; then
            echo "::error::A credential file is tracked in this repository."
            exit 1
          fi
          echo "No credential files tracked."

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Cache SQLcl
        id: sqlcl-cache
        uses: actions/cache@v4
        with:
          path: ~/sqlcl
          key: sqlcl-latest-v1

      - name: Install SQLcl
        if: steps.sqlcl-cache.outputs.cache-hit != 'true'
        run: |
          curl -sSLf -o /tmp/sqlcl.zip \
            https://download.oracle.com/otn_software/java/sqldeveloper/sqlcl-latest.zip
          unzip -q /tmp/sqlcl.zip -d "$HOME"

      - name: Add SQLcl to PATH
        run: echo "$HOME/sqlcl/bin" >> "$GITHUB_PATH"

      - name: Show SQLcl version
        run: sql -v

      - name: apex validate
        run: |
          set -o pipefail
          sql -nolog <<'SQL' | tee validate.log
          apex validate -input executive-dashboard/apex
          exit
          SQL

          # `apex validate` exits 0 even when validation fails — verified
          # 2026-11-09 against SQLcl 26.3.1, which reported two compile errors
          # and still returned success to the shell. So the exit code above is
          # NOT the gate; this is. Do not remove it.
          #
          # Matched on SQLcl's own marker rather than the word "error", which
          # appears legitimately in APEXLang source (errorMessage:, error { }).
          if grep -qiE 'APEXlang Compile Errors|ORA-[0-9]{5}|SP2-[0-9]{4}' validate.log; then
            echo "::error::apex validate reported errors — see the log above."
            exit 1
          fi

          if ! grep -qi 'Validation successful' validate.log; then
            echo "::error::apex validate did not report success. It may not have run at all."
            exit 1
          fi

          echo "APEXLang source is valid."

      - name: Upload validation log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: apex-validate-log
          path: validate.log
          if-no-files-found: ignore

  sql-safety:
    name: SQL safety lint
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0        # the migration-immutability check needs history

      - name: Lint the SQL
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            bash db/lint.sh "origin/${{ github.base_ref }}"
          else
            bash db/lint.sh
          fi
